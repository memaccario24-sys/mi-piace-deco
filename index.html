<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro de ventas - Mi Piace Deco</title>
<style>
:root{--bg:#f7f3ee;--card:#fff;--ink:#2f2a26;--muted:#776f68;--accent:#9a6b4a;--line:#e6ddd4;--bad:#a53b32;--ok:#26734d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:8px 0 18px}.hero h1{margin:0;font-size:clamp(25px,5vw,40px)}.hero p{margin:4px 0 0;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 6px 20px #5a3c2510}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}label{font-weight:700}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cfc3b8;border-radius:10px;background:#fff;color:var(--ink)}input:focus,select:focus,textarea:focus,button:focus{outline:3px solid #c99b7860;outline-offset:1px}.products{display:grid;gap:12px}.row{display:grid;grid-template-columns:minmax(250px,2.7fr) 90px 150px 150px 46px;gap:9px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:14px;position:relative}.small{font-size:12px;color:var(--muted);margin-top:4px}.stock.low{color:var(--bad);font-weight:700}.stock.ok{color:var(--ok)}.btn{border:0;border-radius:11px;padding:11px 14px;cursor:pointer;font-weight:800}.primary{background:var(--accent);color:#fff}.secondary{background:#ece3db;color:var(--ink)}.danger{background:#f7dfdc;color:var(--bad);padding:10px}.actions{display:flex;flex-wrap:wrap;gap:10px}.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f6eee7;padding:12px;border-radius:12px}.metric b{display:block;font-size:20px;margin-top:5px}.msg{min-height:22px;margin:10px 0;color:var(--bad);font-weight:700}.receipt{display:flex;gap:12px;align-items:center}.receipt img{width:80px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:none}.hint{background:#fff7df;border:1px solid #ead59f;border-radius:10px;padding:10px;margin-bottom:12px;color:#66521d}@media(max-width:760px){.grid,.totals{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row .product-field{grid-column:1/-1}.row .remove{position:absolute;right:8px;top:8px}.hero{display:block}}@media(max-width:420px){.row{grid-template-columns:1fr}.row .product-field{grid-column:auto}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero"><div><h1>Mi Piace Deco</h1><p>Registro de ventas</p></div><div id="catalogCount" class="small"></div></header>
<section class="card"><h2>Datos de la venta</h2><div class="grid">
<div class="field"><label for="client">Cliente</label><input id="client" autocomplete="name" required></div>
<div class="field"><label for="date">Fecha</label><input id="date" type="date" required></div>
<div class="field"><label for="payment">Método de pago</label><select id="payment"><option>Transferencia</option><option>Efectivo</option><option>Mercado Pago</option><option>Tarjeta</option><option>Otro</option></select></div>
<div class="field"><label for="receipt">Comprobante</label><div class="receipt"><input id="receipt" type="file" accept="image/*,.pdf"><img id="preview" alt="Vista previa del comprobante"></div><div class="small">El CSV guardará el nombre del archivo. La imagen no se incrusta.</div></div>
</div></section>
<section class="card"><h2>Productos</h2><div class="hint">Escribí parte del nombre o el ID y elegí una sugerencia. Podés agregar varios productos a la misma venta.</div><datalist id="productOptions"></datalist><div id="products" class="products"></div><button id="add" type="button" class="btn secondary">+ Agregar producto</button></section>
<section class="card"><div class="totals"><div class="metric">Unidades<b id="units">0</b></div><div class="metric">Total venta<b id="saleTotal">$ 0</b></div><div class="metric">Ganancia estimada<b id="profitTotal">$ 0</b></div></div><div id="msg" class="msg" aria-live="polite"></div><div class="actions"><button id="download" type="button" class="btn primary">Guardar Venta</button><button id="clear" type="button" class="btn secondary">Nueva venta</button></div></section>
</main>

const byLabel=new Map();
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(Number(n)||0);
function labelFor(p){return `${p.id} - ${p.item}`}
for(const p of catalog)byLabel.set(labelFor(p),p);
$('#catalogCount').textContent=`${catalog.length} productos cargados`;
$('#date').value=new Date().toISOString().slice(0,10);
$('#productOptions').innerHTML=catalog.map(p=>`<option value="${escapeHtml(labelFor(p))}"></option>`).join('');
function escapeHtml(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function selectedProduct(row){return byLabel.get(row.querySelector('.product').value.trim())||null}
function addRow(){
 const el=document.createElement('div'); el.className='row';
 el.innerHTML=`<div class="field product-field"><label>Producto</label><input class="product" list="productOptions" placeholder="Ej.: Malik, cafetera o #55" autocomplete="off"><div class="small stock"></div></div><div class="field"><label>Cantidad</label><input class="qty" type="number" min="1" step="1" value="1"></div><div class="field"><label>Precio unitario</label><input class="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></div><div class="field"><label>Subtotal</label><input class="subtotal" readonly></div><button type="button" class="btn danger remove" aria-label="Eliminar producto">×</button>`;
 $('#products').appendChild(el);
 el.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));
 el.querySelector('.remove').addEventListener('click',()=>{el.remove();if(!$('#products').children.length)addRow();calc()});
 calc(); el.querySelector('.product').focus();
}
function calc(){
 let units=0,sale=0,profit=0;
 document.querySelectorAll('.row').forEach(r=>{
  const p=selectedProduct(r),q=Math.max(0,Number(r.querySelector('.qty').value)||0),unit=Math.max(0,Number(r.querySelector('.price').value)||0),sub=q*unit;
  r.querySelector('.subtotal').value=money(sub);
  const st=r.querySelector('.stock');
  st.textContent=p?`Disponible: ${p.stock} · Costo unitario: ${money(p.cost)}`:'Elegí una opción válida de la lista.';
  st.className='small stock '+(p?(q>p.stock?'low':'ok'):'');
  if(p){units+=q;sale+=sub;profit+=sub-q*p.cost}
 });
 $('#units').textContent=units; $('#saleTotal').textContent=money(sale); $('#profitTotal').textContent=money(profit);
}
function safeCsv(v){v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"'}
function download(){
 const client=$('#client').value.trim(),date=$('#date').value,payment=$('#payment').value,receipt=$('#receipt').files[0]?.name||'',valid=[];
 document.querySelectorAll('.row').forEach(r=>{const p=selectedProduct(r),q=Number(r.querySelector('.qty').value),unit=Number(r.querySelector('.price').value);if(p&&q>0&&unit>=0)valid.push({p,q,unit})});
 if(!client||!date||!valid.length){$('#msg').textContent='Completá cliente, fecha y al menos un producto válido con cantidad y precio.';return}
 for(const x of valid){if(x.q>x.p.stock){$('#msg').textContent=`La cantidad de ${x.p.item} supera el stock disponible (${x.p.stock}).`;return}}
 $('#msg').textContent='';
 const d=new Date(date+'T12:00:00'),month=d.getMonth()+1,saleId='V'+date.replaceAll('-','')+'-'+String(Date.now()).slice(-6);
 const headers=['VentaID','Mes','ID','Item','Cant','Cliente','Fecha ','Método pago','Precio','Costo','Ganancia','Comprobante'];
 const rows=valid.map(x=>{const price=x.q*x.unit,cost=x.q*x.p.cost;return[saleId,month,x.p.id,x.p.item,x.q,client,date,payment,price,cost,price-cost,receipt]});
 const csv='\uFEFF'+[headers,...rows].map(r=>r.map(safeCsv).join(';')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`venta_${saleId}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$('#add').addEventListener('click',addRow);
async function guardarVenta(){

  const client=$('#client').value.trim();
  const date=$('#date').value;
  const payment=$('#payment').value;
  const receipt=$('#receipt').files[0]?.name||'';

  const valid=[];

document.querySelectorAll('.row').forEach(r=>{
    const p = selectedProduct(r);
    const q = Number(r.querySelector('.qty').value);
    const unit = Number(r.querySelector('.price').value);

    if(p && q > 0 && unit >= 0){
      valid.push({
        p,
        q,
        unit
      });
    }
});

  if(!client || !date || !valid.length){
    $('#msg').textContent='Completá cliente, fecha y al menos un producto.';
    return;
  }

  const d=new Date(date+'T12:00:00');
  const month=d.getMonth()+1;

  const saleId=
    'V'+date.replaceAll('-','')+'-'+String(Date.now()).slice(-6);

  $('#msg').textContent='Guardando venta...';

  try{

    for(const x of valid){

      const precio=x.q*x.unit;
      console.log(x);
      const costo=x.q*x.p.cost;
      const ganancia=precio-costo;

      await fetch(
        'https://hook.us2.make.com/hjqe7m2gbyn09azf6rptpaao6toj34fd',
        {
          method:'POST',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify({
            token:"MPD2110",
            VentaID:saleId,
            Mes:month,
            ID:x.p.id,
            Item:x.p.item,
            Cantidad:x.q,
            Cliente:client,
            Fecha:date,
            MetodoPago:payment,
            Precio:precio,
            Costo:costo,
            Ganancia:ganancia,
            Comprobante:receipt
          })
        }
      );
    }

    $('#msg').style.color='green';
    $('#msg').textContent='✅ Venta guardada en Excel';

  }catch(err){

    console.error(err);

    $('#msg').style.color='red';
    $('#msg').textContent='❌ Error al enviar a Make';
  }
}
$('#download').addEventListener('click',guardarVenta);
$('#clear').addEventListener('click',()=>{if(confirm('¿Limpiar la venta actual?')){$('#client').value='';$('#receipt').value='';$('#preview').style.display='none';$('#products').innerHTML='';addRow();calc()}});
$('#receipt').addEventListener('change',e=>{const f=e.target.files[0],img=$('#preview');if(f&&f.type.startsWith('image/')){img.src=URL.createObjectURL(f);img.style.display='block'}else img.style.display='none'});
addRow();
</script>
</body></html>
